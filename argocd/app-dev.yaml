apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortener-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mrnobodyone/gitops-config.git
    targetRevision: main
    path: charts/url-shortener
    helm:
      valueFiles:
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
