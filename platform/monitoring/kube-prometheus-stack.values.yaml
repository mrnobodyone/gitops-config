# k3s встраивает эти компоненты в один процесс, их метрики недоступны,
# и без отключения алерты вечно красные
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 3GB
    # подхватывать ServiceMonitor и правила из любых namespace и без метки release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    nodeSelector: {role: monitoring}
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 700Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}

alertmanager:
  alertmanagerSpec:
    nodeSelector: {role: monitoring}
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
    secrets: [alertmanager-telegram]
  config:
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
            chat_id: 439002384
            send_resolved: true

grafana:
  nodeSelector: {role: monitoring}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: lab-ca
    hosts: [grafana.lab]
    tls:
      - secretName: grafana-tls
        hosts: [grafana.lab]

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 48Mi}
